id: mep_monthly_report
requirements:
  - name: ecoscope-platform
    version: ">=2.15.0, <2.16.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc14.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-ste
    version: "0.0.0rc1.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-mep
    version: "*"
    channel: "file:///tmp/ecoscope-workflows-custom/release/artifacts/"
    
  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  - name: opentelemetry-sdk
    version: ">=1.20.0,<2.0.0"
    channel: conda-forge

task-instance-defaults:
  skipif:
    conditions: 
      - any_is_empty_df 
      - any_dependency_skipped

rjsf-overrides:
  properties: 
    Subject Group.properties.subject_group_var.properties.var.title: Subject Group Name
    Subject Group.properties.subject_group_var.properties.var.default: Elephants
    Previous Period.properties.set_previous_period.properties.offset.description: "Choose how to calculate the comparison period's Start Date. In every mode, the comparison period ends on your selected time range's Start Date (so it never overlaps with the current period) — only the Start Date changes."


workflow:
  # set workflow details
  - name: Set Workflow Details
    id: workflow_details
    task: set_workflow_details

  # define time range
  - name: Time Range
    id: time_range
    task: set_time_range

  # set groupers -- limiting this to subject_name
  - name: Configure Grouping Strategy
    id: groupers
    task: set_groupers
    partial:
      groupers:
        - index_name: "name"

  # set basemaps
  - name: Configure Base Map Layers
    id: configure_base_maps
    task: set_base_maps_pydeck

  # connect to earthranger
  - name: Connect to EarthRanger
    id: er_client_name
    task: set_er_connection

  # get events -- elephant sighting and persist file
  - name: Retrieve Events
    id: get_events_data
    task: get_events
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns:
        - id
        - time
        - event_type
        - event_category
        - reported_by
        - serial_number
        - geometry
        - created_at
        - event_details
      raise_on_empty: true
      include_details: true
      include_updates: false
      include_related_events: false
      include_null_geometry: false
      include_display_values: false
      force_point_geometry: true 

  - name: Normalize event details 
    id: normalize_event_details
    task: normalize_json_column
    partial:
      column: event_details
      df: ${{ workflow.get_events_data.return }}
      skip_if_not_exists: true 
      sort_columns: true

  - name: Persist events as csv
    id: persist_events_csv
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      filename: events
      df: ${{ workflow.normalize_event_details.return }}

  - name: Apply colormap to events 
    id: apply_event_colormap 
    task: apply_color_map
    partial: 
      df: ${{ workflow.normalize_event_details.return }}
      input_column_name: event_type 
      output_column_name: event_type_colors 
      colormap: tab20

  - name: Generate events point layers
    id: generate_ev_layers
    task: ecoscope_workflows_ext_custom.tasks.results.create_scatterplot_layer
    partial:
      data_url: null
      layer_style:
        get_fill_color: event_type_colors
        get_line_color: event_type_colors
        get_line_width: 0.55
        get_radius: 3.55
        opacity: 0.55
        stroked: true
      legend:
        title: Legend
        label_column: event_type 
        color_column: event_type_colors
        sort: null 
        label_suffix: null 
      geodataframe: ${{ workflow.apply_event_colormap.return }}

  - name: Zoom view to gdf extent
    id: events_image_extent
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.compute_view_state_from_gdf
    partial:
      pitch: 0
      bearing: 0
      max_zoom: 15
      gdf: ${{ workflow.apply_event_colormap.return }}

  - name: Draw events map
    id: draw_sightings_map
    task: ecoscope_workflows_ext_custom.tasks.results.draw_map
    partial:
      tile_layers: ${{ workflow.configure_base_maps.return }}
      static: false
      title: null
      max_zoom: 10
      legend_style:
        placement: "bottom-right"
      geo_layers: ${{ workflow.generate_ev_layers.return }}
      view_state: ${{ workflow.events_image_extent.return }}

  - name: Persist events sightings map
    id: persist_sightings_urls
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.draw_sightings_map.return }}
      filename: elephant_sightings_map.html # -- convert this to png
      filename_suffix: null

  # get relocations  -- collar voltages for subjects and persist file
  - title: Subject Group
    type: task-group
    description: Choose subject group to generate collar voltage charts and overall speedmap
    tasks:
      - name: null
        id: subject_group_var
        task: set_string_var

  - name: Get subject group observations
    id: subject_observations
    task: get_subjectgroup_observations
    partial:
      filter: clean
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      subject_group_name: ${{ workflow.subject_group_var.return }} # pass this to word doc
      raise_on_empty: false
      include_details: true
      include_subjectsource_details: true

  - name: Get timezone from time range
    id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  - name: Convert relocs to timezone
    id: convert_relocs_timezone
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.subject_observations.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
        - fixtime

  - name: Transform observations to relocations
    id: subject_reloc
    task: process_relocations
    partial:
      observations: ${{ workflow.subject_observations.return }}
      relocs_columns:
        - groupby_col
        - fixtime
        - junk_status
        - geometry
        - extra__subject__name
        - extra__subject__hex
        - extra__subject__sex
        - extra__created_at
        - extra__subject__subject_subtype
        - extra__subjectsource__id
        - extra__subjectsource__assigned_range
        - extra__observation_details

      filter_point_coords:
        - x: 180.000000
          y: 90.000000
        - x: 0.000000
          y: 0.000000
        - x: 1.000000
          y: 1.000000

  - title: Previous Period
    type: task-group
    description: >-
      Define the comparison ("previous") period to contrast against your selected time range.
      Every option below computes a period that ends on the same End Date as your time range, then
      works backward to determine its Start Date. Choose Custom to enter your own Years / Months /
      Weeks / Days offset (defaults to 1 month back), Preset for a common lookback (e.g. 1, 3 or 6
      months, or 1 year back), or Calendar to pick an exact Start Date.
    tasks: 
      - name: null
        id: set_previous_period
        task: ecoscope_workflows_ext_ste.tasks.filter.flexible_previous_period
        partial: 
          timerange: ${{ workflow.time_range.return }}

  - name: Convert previous relocs to timezone
    id: convert_prev_relocs_timezone
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.previous_subject_observations.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
        - fixtime

  - name: Transform previous observations to relocations
    id: previous_subject_reloc
    task: process_relocations
    partial:
      observations: ${{ workflow.convert_prev_relocs_timezone.return }}
      relocs_columns:
        - groupby_col
        - fixtime
        - junk_status
        - geometry
        - extra__subject__name
        - extra__subject__hex
        - extra__subject__sex
        - extra__created_at
        - extra__subject__subject_subtype
        - extra__subjectsource__id
        - extra__subjectsource__assigned_range
        - extra__observation_details

      filter_point_coords:
        - x: 180.000000
          y: 90.000000
        - x: 0.000000
          y: 0.000000
        - x: 1.000000
          y: 1.000000

  - name: Sort relocs by fixtime 
    id: sort_curr_relocs 
    task: sort_values 
    partial: 
      df: ${{ workflow.subject_reloc.return }}
      column_name: fixtime 
      ascending: true 
      na_position: last 
  
  - name: Persist relocations as geoparquet
    id: persist_relocs_geoparquet
    task: persist_df
    partial:
      df: ${{ workflow.sort_curr_relocs.return }}
      filetype: geoparquet
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: relocations

  - name: Sort previous relocs by fixtime 
    id: sort_prev_relocs
    task: sort_values 
    partial: 
      df: ${{ workflow.previous_subject_reloc.return }}
      column_name: fixtime 
      ascending: true 
      na_position: last 
  
  - name: Persist previous period relocations as geoparquet
    id: persist_prev_relocs_geoparquet
    task: persist_df
    partial:
      df: ${{ workflow.sort_prev_relocs.return }}
      filetype: geoparquet
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: previous_period_relocations

  - name: Extract voltage from current relocs 
    id: extract_current_voltage 
    task: extract_value_from_json_column 
    partial: 
      df: ${{ workflow.sort_curr_relocs.return }}
      column_name: observation_details
      field_name_options: ["battery", "mainVoltage", "batt", "power"]
      output_type: float
      output_column_name: voltage

  - name: Extract voltage from previous relocs
    id: extract_previous_voltage
    task: extract_value_from_json_column
    partial:
      df: ${{ workflow.sort_prev_relocs.return }}
      column_name: observation_details
      field_name_options: ["battery", "mainVoltage", "batt", "power"]
      output_type: float
      output_column_name: voltage

  - name: Split current reloc groups 
    id: split_current_relocs 
    task: split_groups 
    partial: 
      df: ${{ workflow.extract_current_voltage.return }}
      groupers: ${{ workflow.groupers.return }}

  - name: Split previous reloc groups 
    id: split_previous_relocs 
    task: split_groups 
    partial: 
      df: ${{ workflow.extract_previous_voltage.return }}
      groupers: ${{ workflow.groupers.return }}

  - name: Get first subject name for filenames
    id: unique_subject_name
    task: column_first_unique_value
    partial:
      column_name: "name"
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.split_current_relocs.return }}

  - name: Safe-string subject name for filenames
    id: safe_subject_name
    task: ecoscope_workflows_ext_ste.tasks.transformation.safe_string
    mapvalues:
      argnames: value
      argvalues: ${{ workflow.unique_subject_name.return }}

  - name: Build voltage chart filename 
    id: voltage_filename 
    task: prefix_string_var
    partial: 
      var: _historic_voltage.html 
    mapvalues:
      argnames: prefix 
      argvalues: ${{ workflow.safe_subject_name.return }}

  - name: Zip current relocs and previous relocs 
    id: zip_current_prev_name
    task: groupbykey 
    partial: 
      iterables: 
        - ${{ workflow.split_current_relocs.return }}
        - ${{ workflow.split_previous_relocs.return }}

  - name: Plot Historic Voltage chart 
    id: draw_historic_voltage
    task: plot_historic_voltage
    partial: 
      column: voltage
    mapvalues: 
      argnames: 
        - current_relocs 
        - previous_relocs 
      argvalues: ${{ workflow.zip_current_prev_name.return }}

  - name: Combine historic voltage filename with text
    id: historic_voltage_text
    skipif:
      conditions:
        - any_dependency_skipped
        - any_keyed_iterables_are_skips
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.voltage_filename.return }}
        - ${{ workflow.draw_historic_voltage.return }}

  - name: Persist collar voltage text as html 
    id: persist_collar_html
    task: persist_text 
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: null
    mapvalues:
      argnames: 
        - filename
        - text
      argvalues: ${{ workflow.historic_voltage_text.return }}
  
  - name: Create widget for collar voltage plot
    id: collared_voltage_widget
    task: create_map_widget_single_view
    skipif:
      conditions: 
        - never
    partial:
      title: Collar Voltage
    map:
      argnames:
        - view 
        - data
      argvalues: ${{ workflow.persist_collar_html.return }}

  - name: Merge collar voltage plot widgets 
    id: grouped_collared_widget
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.collared_voltage_widget.return }}

  - name: Convert collar voltage charts to png 
    id: convert_collar_png 
    task: html_to_png 
    partial:
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      config: 
        full_page: false
        device_scale_factor: 2.0
        wait_for_timeout: 10
        max_concurrent_pages: 1
    mapvalues: 
      argnames: html_path 
      argvalues: ${{ workflow.persist_collar_html.return }}

  # relocs to trajectories -- speedmap and persist file
  - name: Convert relocations to trajectories 
    id: convert_to_trajectories 
    task: relocations_to_trajectory 
    partial: 
      relocations: ${{ workflow.sort_curr_relocs.return }}
      trajectory_segment_filter:
        min_length_meters: 0.001
        max_length_meters: 5000
        min_time_secs: 1
        max_time_secs: 21600
        min_speed_kmhr: 0.01
        max_speed_kmhr: 9

  - name: Add temporal index to trajectories 
    id: add_temporal_index_to_traj 
    task: add_temporal_index
    partial: 
      df: ${{ workflow.convert_to_trajectories.return }}
      time_col: segment_start 
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true 
      format: mixed 

  - name: Classify trajectories by speed
    id: classify_trajectories_speed_bins
    task: apply_classification
    partial:
      df: ${{ workflow.add_temporal_index_to_traj.return }}
      input_column_name: speed_kmhr
      output_column_name: speed_bins
      classification_options:
        scheme: equal_interval
        k: 6
      label_options:
        label_ranges: true
        label_decimals: 1
        label_suffix: " km/h"

  - name: Sort trajectories by speed bins
    id: sort_trajs_by_speed
    task: sort_values
    partial:
      column_name: speed_bins
      na_position: first
      ascending: true
      df: ${{ workflow.classify_trajectories_speed_bins.return }}

  - name: Apply colormap to speed bins
    id: apply_speed_colormap
    task: apply_color_map
    partial:
      input_column_name: speed_bins
      output_column_name: speed_bins_colormap
      colormap:
        - "#1a9850"
        - "#91cf60"
        - "#d9ef8b"
        - "#fee08b"
        - "#fc8d59"
        - "#d73027"
      df: ${{ workflow.sort_trajs_by_speed.return }}

  - name: Exclude unnecessary columns from speedmap gdf
    id: filter_speed_cols
    task: subset_columns
    partial:
      columns:
        - dist_meters
        - speed_bins_colormap
        - geometry
        - speed_kmhr
        - speed_bins
      exclude: null 
      df: ${{ workflow.apply_speed_colormap.return }}

  - name: Generate speedmap layers
    id: generate_speedmap_layers
    task: ecoscope_workflows_ext_custom.tasks.results.create_path_layer
    partial:
      data_url: null
      layer_style:
        get_color: speed_bins_colormap
        get_width: 2.85
        width_scale: 1
        width_min_pixels: 2
        width_max_pixels: 8
        width_units: pixels
        cap_rounded: true
        joint_rounded: true
        billboard: false
        opacity: 0.55
        stroked: true
      legend:
        title: Speed (km/h)
        label_column: speed_bins
        color_column: speed_bins_colormap
        sort: ascending
        label_suffix: null
      geodataframe: ${{ workflow.filter_speed_cols.return }}

  - name: Zoom view to gdf speed extent
    id: speed_image_extent
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.compute_view_state_from_gdf
    partial:
      pitch: 0
      bearing: 0
      max_zoom: 15
      gdf: ${{ workflow.filter_speed_cols.return }}

  - name: Draw speedmap
    id: draw_speedmap
    task: ecoscope_workflows_ext_custom.tasks.results.draw_map
    partial:
      tile_layers: ${{ workflow.configure_base_maps.return }}
      static: false
      title: null
      max_zoom: 10
      legend_style:
        placement: "bottom-right"
      geo_layers: ${{ workflow.generate_speedmap_layers.return }}
      view_state: ${{ workflow.speed_image_extent.return }}

  - name: Persist speedmap html
    id: persist_speedmap_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: null
      filename: speedmap.html
      text: ${{ workflow.draw_speedmap.return }}

  # generate sitrep report -- persist df
  - name: Get sitrep config
    id: get_sitrep_config
    task: get_sitrep_event_config
    partial:
      region_column: region

  - name: Generate sitrep report
    id: generate_sitrep_df
    task: compile_sitrep
    partial:
      er_io: ${{ workflow.er_client_name.return }}
      event_details: ${{ workflow.get_sitrep_config.return }}
      time_range: ${{ workflow.time_range.return }}

  - name: Persist sitrep as csv
    id: persist_sitrep_csv
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      filename: sitrep_report
      df: ${{ workflow.generate_sitrep_df.return }}

  - name: Retrieve vehicle patrols
    id: vehicle_patrols
    task: get_patrol_observations
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      include_patrol_details: true
      raise_on_empty: false
      sub_page_size: 100
      patrols_overlap_daterange: true

  - name: Transform observations to relocations
    id: vehicle_patrol_reloc
    task: process_relocations
    partial:
      observations: ${{ workflow.vehicle_patrols.return }}
      relocs_columns:
        - patrol_id
        - patrol_start_time
        - patrol_end_time
        - geometry
        - patrol_type__value
        - patrol_type__display
        - patrol_serial_number
        - patrol_status
        - patrol_subject
        - groupby_col
        - fixtime
        - junk_status
        - extra__source

      filter_point_coords:
        - x: 180.000000
          y: 90.000000
        - x: 0.000000
          y: 0.000000
        - x: 1.000000
          y: 1.000000

  - name: Transform relocations to trajectories
    id: vehicle_patrol_traj
    task: relocations_to_trajectory
    partial:
      relocations: ${{ workflow.vehicle_patrol_reloc.return }}
      trajectory_segment_filter:
        min_length_meters: 0.35
        max_length_meters: 5000.0
        max_time_secs: 18000.0
        min_time_secs: 1.0
        max_speed_kmhr: 100.0
        min_speed_kmhr: 10.0

  - name: Persist vehicle patrol trajectories
    id: persist_vehicle_traj
    task: persist_df
    partial:
      df: ${{ workflow.vehicle_patrol_traj.return }}
      filetype: geoparquet
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: vehicle_patrol_trajectories

  - name: Vehicle patrol trajectories colormap
    id: vehicle_traj_colormap
    task: apply_color_map
    partial:
      df: ${{ workflow.vehicle_patrol_traj.return }}
      colormap: viridis
      input_column_name: extra__patrol_type__value
      output_column_name: patrol_type_colormap

  - name: Zoom view to gdf vehicle extent
    id: vehicle_extent
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.compute_view_state_from_gdf
    partial:
      pitch: 0
      bearing: 0
      max_zoom: 15
      gdf: ${{ workflow.vehicle_traj_colormap.return }}

  - name: Create vehicle patrol layers
    id: vehicle_patrol_path_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_path_layer
    partial:
      data_url: null
      layer_style:
        get_color: patrol_type_colormap
        get_width: 2.85
        width_scale: 1
        width_min_pixels: 2
        width_max_pixels: 8
        width_units: pixels
        cap_rounded: true
        joint_rounded: true
        billboard: false
        opacity: 0.55
        stroked: true
      legend:
        title: Patrol team
        label_column: extra__patrol_type__value
        color_column: patrol_type_colormap
        sort: ascending
        label_suffix: null
      geodataframe: ${{ workflow.vehicle_traj_colormap.return }}

  - name: Draw vehicle patrols map
    id: draw_vehicles_map
    task: ecoscope_workflows_ext_custom.tasks.results.draw_map
    partial:
      tile_layers: ${{ workflow.configure_base_maps.return }}
      static: false
      title: null
      max_zoom: 10
      legend_style:
        placement: "bottom-right"
      geo_layers: ${{ workflow.vehicle_patrol_path_layer.return }}
      view_state: ${{ workflow.vehicle_extent.return }}

  - name: Persist vehicle patrols as text
    id: vehicle_patrol_map
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: vehicle_patrols_map.html
      filename_suffix: null
      text: ${{ workflow.draw_vehicles_map.return }} # convert this to png

  # foot patrols
  - name: Retrieve foot patrols
    id: foot_patrols
    task: get_patrol_observations
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      include_patrol_details: true
      raise_on_empty: false
      sub_page_size: 100
      patrols_overlap_daterange: true

  - name: Transform observations to relocations
    id: foot_patrol_reloc
    task: process_relocations
    partial:
      observations: ${{ workflow.foot_patrols.return }}
      relocs_columns:
        - patrol_id
        - patrol_start_time
        - patrol_end_time
        - geometry
        - patrol_type__value
        - patrol_type__display
        - patrol_serial_number
        - patrol_status
        - patrol_subject
        - groupby_col
        - fixtime
        - junk_status
        - extra__source

      filter_point_coords:
        - x: 180.000000
          y: 90.000000
        - x: 0.000000
          y: 0.000000
        - x: 1.000000
          y: 1.000000

  - name: Transform relocations to trajectories
    id: foot_patrol_traj
    task: relocations_to_trajectory
    partial:
      relocations: ${{ workflow.foot_patrol_reloc.return }}
      trajectory_segment_filter:
        min_length_meters: 0.001
        max_length_meters: 5000.0
        max_time_secs: 14400.0
        min_time_secs: 1.0
        max_speed_kmhr: 9.0
        min_speed_kmhr: 0.5

  - name: Persist foot patrol trajectories
    id: persist_foot_traj
    task: persist_df
    partial:
      df: ${{ workflow.foot_patrol_traj.return }}
      filetype: geoparquet
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: foot_patrol_trajectories

  - name: Foot patrol trajectories colormap
    id: foot_traj_colormap
    task: apply_color_map
    partial:
      df: ${{ workflow.foot_patrol_traj.return }}
      colormap: viridis
      input_column_name: extra__patrol_type__value
      output_column_name: patrol_type_colormap

  - name: Zoom view to gdf speed extent
    id: foot_image_extent
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.compute_view_state_from_gdf
    partial:
      pitch: 0
      bearing: 0
      max_zoom: 15
      gdf: ${{ workflow.foot_traj_colormap.return }}

  - name: Create foot patrol layers
    id: foot_patrol_path_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_path_layer
    partial:
      data_url: null
      layer_style:
        get_color: patrol_type_colormap
        get_width: 2.85
        width_scale: 1
        width_min_pixels: 2
        width_max_pixels: 8
        width_units: pixels
        cap_rounded: true
        joint_rounded: true
        billboard: false
        opacity: 0.55
        stroked: true
      legend:
        title: Patrol team
        label_column: extra__patrol_type__value
        color_column: patrol_type_colormap
        sort: ascending
        label_suffix: null
      geodataframe: ${{ workflow.foot_traj_colormap.return }}

  - name: Draw foot patrols map
    id: draw_foot_map
    task: ecoscope_workflows_ext_custom.tasks.results.draw_map
    partial:
      tile_layers: ${{ workflow.configure_base_maps.return }}
      static: false
      title: null
      max_zoom: 10
      legend_style:
        placement: "bottom-right"
      geo_layers: ${{ workflow.foot_patrol_path_layer.return }}
      view_state: ${{ workflow.foot_image_extent.return }}

  - name: Persist foot patrols as text
    id: foot_patrol_map
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: foot_patrols_map.html
      filename_suffix: null
      text: ${{ workflow.draw_foot_map.return }} # convert this to png

