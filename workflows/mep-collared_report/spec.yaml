id: mep_collared_report
requirements:
  - name: ecoscope-platform
    version: ">=2.15.0, <2.16.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc14.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-ste
    version: "0.0.0rc1.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-mep
    version: "*"
    channel: "file:///tmp/ecoscope-workflows-custom/release/artifacts/"
    
  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  - name: opentelemetry-sdk
    version: ">=1.20.0,<2.0.0"
    channel: conda-forge

task-instance-defaults:
  skipif:
    conditions: 
      - any_is_empty_df 
      - any_dependency_skipped

rjsf-overrides:
  properties: 
    Subject Group.properties.subject_group_var.properties.var.title: Subject Group Name
    Subject Group.properties.subject_group_var.properties.var.default: Elephants

  $defs:
    # Restrict category options to Subject Name ,Subject Sex and Subject Subtype
    ValueGrouper.properties.index_name.oneOf:
      - const: subject_name
        title: Subject Name

workflow:
  # set workflow details 
  - name: Set workflow details
    id: workflow_details
    task: set_workflow_details

  # define time range 
  - name: Define analysis time range 
    id: time_range 
    task: set_time_range 
    
  # set groupers -- limiting this to subject_name
  - name: Configure grouping strategy 
    id: groupers 
    task: set_groupers
    partial: 
      groupers:
        - index_name: subject_name
  
  # set basemaps
  - name: Configure base map layers 
    id: configure_base_maps 
    task: set_base_maps_pydeck

  # connect to earthranger
  - name: Connect to EarthRanger
    id: er_client_name
    task: set_er_connection 
  
  # connect to earthengine 
  - name: Connect to EarthEngine
    id: gee_project_name
    task: set_gee_connection 
  
  # set subject group name to analyze
  - title: Subject Group
    type: task-group
    description: Choose subject group to analyze 
    tasks:
      - name: null
        id: subject_group_var
        task: set_string_var

  # Please note that this workflow only uses ldx db 
  - name: Download filtered LandDX database 
    id: persist_landdx
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/bay4wo72odh1q09ftb9rk/land_dx.gpkg?rlkey=7n2tbmji5xhfyma0slmcpz718&st=12r9nqn2&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false

  - name: Load landdx file 
    id: load_landdx
    task: load_df 
    partial: 
      file_path: ${{ workflow.persist_landdx.return }}
      layer: null #landDx_polygons
      deserialize_json: false 
  
  - name: Filter community conservancy layer only 
    id: filter_community_cons
    task: filter_df
    partial: 
      df: ${{ workflow.load_landdx.return }}
      column_name: "type"
      op: equal 
      value: "Community Conservancy"
      reset_index: true 

  - name: Filter national reserve layer only 
    id: filter_national_res
    task: filter_df
    partial: 
      df: ${{ workflow.load_landdx.return }}
      column_name: "type"
      op: equal 
      value: "National Reserve"
      reset_index: true 

  - name: Filter national park layer only 
    id: filter_national_park
    task: filter_df
    partial: 
      df: ${{ workflow.load_landdx.return }}
      column_name: "type"
      op: equal 
      value: "National Park"
      reset_index: true 

  - name: Create community conservancy layer
    id: create_community_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial:
      geodataframe: ${{ workflow.filter_community_cons.return }}
      data_url: null
      layer_style:
        filled: true
        stroked: true
        get_fill_color: [166, 182, 151, 255]     
        get_line_color: [166, 182, 151, 255]
        opacity: 0.15 
        get_line_width: 1.55
        get_elevation: 0
        get_point_radius: 1
        line_width_units: pixels 
        line_width_scale: 1 
        line_width_min_pixels: 1
        line_width_max_pixels: 5
      legend:
        title: "Land Use"
        values:
          - label: Community Conservancy
            color: "#a6b697"
        sort: null
        label_suffix: null

  - name: Create national reserve layer
    id: create_reserve_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial:
      geodataframe: ${{ workflow.filter_national_res.return }}
      data_url: null
      layer_style:
        filled: true
        stroked: true
        get_fill_color: [136, 167, 142, 255]
        get_line_color: [136, 167, 142, 255]
        opacity: 0.15 
        get_line_width: 1.55
        get_elevation: 0
        get_point_radius: 1
        line_width_units: pixels 
        line_width_scale: 1 
        line_width_min_pixels: 1
        line_width_max_pixels: 5
      legend:
        title: ""
        values:
          - label: National Reserve
            color: "#88a78e"
        sort: null
        label_suffix: null

  - name: Create national park layer
    id: create_park_layer
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial:
      geodataframe: ${{ workflow.filter_national_park.return }}
      data_url: null
      layer_style:
        filled: true
        stroked: true
        get_fill_color: [17, 86, 49, 255]
        get_line_color: [17, 86, 49, 255]
        opacity: 0.15 
        get_line_width: 1.55
        get_elevation: 0
        get_point_radius: 1
        line_width_units: pixels 
        line_width_scale: 1 
        line_width_min_pixels: 1
        line_width_max_pixels: 5
      legend:
        title: ""
        values:
          - label: National Park
            color: "#115631"
        sort: null
        label_suffix: null

  # 1. Retrieve subjects df from ER 
  - name: Retrieve subject group observations from EarthRanger 
    id: subject_observations 
    task: get_subjectgroup_observations 
    partial: 
      filter: clean
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      subject_group_name: ${{ workflow.subject_group_var.return }}
      raise_on_empty: false 
      include_details: false 
      include_subjectsource_details: false 
  
  - name: Get timezone from time range
    id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  - name: Convert relocs to timezone
    id: convert_relocs_timezone
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.subject_observations.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
        - fixtime

  - name: Transform observations to relocations 
    id: subject_reloc
    task: process_relocations 
    partial: 
      observations: ${{ workflow.convert_relocs_timezone.return }}
      relocs_columns: [
        "extra__subject_id",
        "extra__id",
        "extra__location",
        "extra__created_at",
        "extra__recorded_at",
        "extra__source",
        "extra__exclusion_flags",
        "extra__subject__updated_at",
        "extra__subject__name",
        "extra__subject__hex",
        "extra__subject__sex",
        "extra__subject__subject_subtype",
        "geometry",
        "groupby_col",
        "fixtime",
        "junk_status"
        ]

      filter_point_coords:
        - x: 180.000000
          y: 90.000000
        - x: 0.000000
          y: 0.000000
        - x: 1.000000
          y: 1.000000

  - name: Map relocations columns
    id: map_reloc_cols
    task: map_columns
    partial:
      df: ${{ workflow.subject_reloc.return }}
      drop_columns: []
      retain_columns: []
      rename_columns: {
        "name": "subject_name",
        }
      raise_if_not_found: true

  - name: Persist relocations as parquet
    id: persist_relocations
    task: persist_df
    partial:
      df: ${{ workflow.map_reloc_cols.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: relocations
      filetype: parquet

  - name: Get unique subject names 
    id: unique_subject_ids
    task: ecoscope_workflows_ext_mep.tasks.transformation.dataframe_column_unique 
    partial: 
      df: ${{ workflow.map_reloc_cols.return }}
      column_name: "subject_id"

  - name: Retrieve Subjects Dataframe from EarthRanger
    id: retrieve_subjects_df 
    task: ecoscope_workflows_ext_mep.tasks.io.get_subjects 
    partial: 
      client: ${{ workflow.er_client_name.return }}
      include_inactive: true 
      bbox: null 
      subject_group_id: null 
      subject_group_name: null
      name: null 
      updated_since: null
      updated_until: null 
      tracks: null 
      ids: ${{ workflow.unique_subject_ids.return }}
      max_ids_per_request: 50
      raise_on_empty: false 

  - name: Normalize subject information 
    id: normalize_subject_info 
    task: normalize_json_column
    partial: 
      column: additional 
      df: ${{ workflow.retrieve_subjects_df.return }}
      skip_if_not_exists: true 
      sort_columns: true 
  
  - name: Rename additional subject columns 
    id: rename_subject_cols 
    task: map_columns
    partial: 
      drop_columns: [
        "content_type",
        "common_name",
        "image_url",
        "url",
        "tracks_available",
        "last_position_status",
        "last_position_date",
        "last_position",
        "device_status_properties",
        "hex",
        "subject_type",
        "subject_subtype",
        "user",
        "sex",
        "additional__external_id",
        "additional__tm_animal_id",
        "additional__external_name",
        "additional__ID notes",
        "additional__id_notes"
        ]
      retain_columns: []
      rename_columns: {
        "id": "groupby_col",
        "name": "subject_name",
        "hex": "hex_color",
        "additional__rgb": "rgb",
        "additional__Bio": "subject_bio",
        "additional__sex": "subject_sex",
        "additional__DOB": "date_of_birth",
        "additional__notes": "notes",
        "additional__status": "status",
        "additional__region": "region",
        "additional__country": "country",
        "additional__id_photo": "photo",
        "additional__distribution": "distribution"
        }

      raise_if_not_found: false
      df: ${{ workflow.normalize_subject_info.return }}

# Compute maturity (default: 6 months)
  - name: Compute subject maturity
    id: subject_maturity_df
    task: compute_subject_maturity
    partial:
      subjects_df: ${{ workflow.rename_subject_cols.return }}
      relocations_gdf: ${{ workflow.map_reloc_cols.return }}
      months_duration: 6

  - name: Persist subjects as parquet
    id: persist_subjects
    task: persist_df
    partial:
      df: ${{ workflow.subject_maturity_df.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: subjects
      filetype: parquet

  # Split subject df by group
  - name: split subjects df by group
    id: split_subject_by_group # use subject_name
    task: split_groups
    partial:
      df: ${{ workflow.subject_maturity_df.return }}
      groupers: ${{ workflow.groupers.return }}

  - title: Get subject name and use it to persist files with it
    type: task-group
    description: Choose a grouper to extract subject names for file naming. This will help in organizing the output files based on individual subjects.
    tasks:
      - name: Get first subject name for filenames
        id: unique_subject_name
        task: column_first_unique_value
        partial:
          column_name: subject_name
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.split_subject_by_group.return }}

      - name: Safe-string subject name for filenames
        id: safe_subject_name
        task: ecoscope_workflows_ext_ste.tasks.transformation.safe_string
        mapvalues:
          argnames: value
          argvalues: ${{ workflow.unique_subject_name.return }}

  # 1.1 Download subject photo
  - name: Download subject profile photo
    id: download_profile_pic
    task: persist_subject_photo
    partial:
      image_type: ".png"
      column: photo #additional__id_photo
      overwrite_existing: true
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }} 
      filename_column: "subject_name"
    mapvalues:
      argnames: subject_df
      argvalues: ${{ workflow.split_subject_by_group.return }}

  # 1.2 Download subject info and persist
  - name: Download subject information
    id: download_subject_info
    task: process_subject_information
    partial:
      maxlen: 1000
    mapvalues:
      argnames: subject_df
      argvalues: ${{ workflow.split_subject_by_group.return }}

  - name: Build subject info filename
    id: subject_info_filename
    task: prefix_string_var
    partial:
      var: _subject_info
    mapvalues:
      argnames: prefix
      argvalues: ${{ workflow.safe_subject_name.return }}

  - name: Zip subject info filename with df
    id: zip_subject_info_filename
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.subject_info_filename.return }}
        - ${{ workflow.download_subject_info.return }}

  - name: Persist subject information as csv
    id: persist_subject_info
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
    mapvalues:
      argnames:
        - filename
        - df
      argvalues: ${{ workflow.zip_subject_info_filename.return }}

  - name: Rename subject info columns for display
    id: display_subject_info
    task: map_columns
    partial:
      drop_columns: [
        "status"
      ]
      retain_columns: []
      rename_columns: {
        "subject_name": "Subject Name",
        "dob": "Date of Birth",
        "sex": "Sex",
        "country": "Country",
        "notes": "Notes",
        # "status": "Status",
        "status_raw": "Status",
        "bio": "Bio",
        "distribution": "Distribution",
        }
      raise_if_not_found: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.download_subject_info.return }}

  - name: Transpose subject info for display
    id: transpose_subject_info
    task: transpose
    partial:
      transposed_column_name: "Field"
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.display_subject_info.return }}

  - name: Rename subject info value column
    id: display_subject_info_transposed
    task: map_columns
    partial:
      drop_columns: []
      retain_columns: []
      rename_columns: {
        "0": "Value",
        }
      raise_if_not_found: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.transpose_subject_info.return }}

  - name: Draw subject info table
    id: subject_info_table_html
    task: draw_table
    partial:
      columns: null
      table_config:
        enable_sorting: false
        enable_filtering: false
        enable_download: false
        hide_header: false
      widget_id: null
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.display_subject_info_transposed.return }}

  - name: Build subject info table filename
    id: subject_info_table_filename
    task: prefix_string_var
    partial:
      var: _subject_info_table.html
    mapvalues:
      argnames: prefix
      argvalues: ${{ workflow.safe_subject_name.return }}

  - name: Zip subject info table filename with text
    id: zip_subject_info_table_filename
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.subject_info_table_filename.return }}
        - ${{ workflow.subject_info_table_html.return }}

  - name: Persist subject info table html
    id: persist_subject_info_table_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: null
    mapvalues:
      argnames:
        - filename
        - text
      argvalues: ${{ workflow.zip_subject_info_table_filename.return }}

  - name: Create subject info table widget
    id: subject_info_table_widget
    task: create_table_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: Subject Info
    map:
      argnames:
        - view
        - data
      argvalues: ${{ workflow.persist_subject_info_table_html.return }}

  - name: Merge subject info table widgets
    id: grouped_info_table_widget
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.subject_info_table_widget.return }}

  # 2. Retrieve events from ER
  - name : Retrieve events from ER
    id: get_events_data
    task: get_events
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      include_details: true
      raise_on_empty: false
      include_null_geometry: true 
      include_updates: false 
      include_related_events: false 
      include_display_values: false
      force_point_geometry: true
      event_types: [
        "mep_collar_check",
        "mep_collaring",
        "mep_source_failure"
        ]
      event_columns: [
        "id",
        "time",
        "event_type",
        "event_category",
        "reported_by",
        "serial_number",
        "geometry",
        "event_details",
        "priority_label"
        ]

  - name: Normalize event details 
    id: normalize_event_details
    task: normalize_json_column
    partial:
      column: event_details
      df: ${{ workflow.get_events_data.return }}
      skip_if_not_exists: true 
      sort_columns: true

  - name: Rename event columns 
    id: rename_event_cols
    task: map_columns
    partial:
      drop_columns: []
      retain_columns: []
      rename_columns: {
        "event_details__pic": "pic",
        "event_details__region": "region",
        "event_details__source": "source",
        "event_details__details": "details",
        "event_details__subject": "groupby_col",
        "event_details__source_id": "source_id",
        "event_details__subject_id": "subject_name",
        "event_details__collaring_type": "collaring_type",
        "event_details__collaring_reason": "collaring_reason",
        "event_details__collar_checked_by": "collar_checked_by"   
        }
      raise_if_not_found: true
      df: ${{ workflow.normalize_event_details.return }}

  - name: Persist events as parquet
    id: persist_events
    task: persist_df
    partial:
      df: ${{ workflow.rename_event_cols.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: events
      filetype: parquet

  # Split events by set groupers
  - name: split events by group
    id: split_events_by_group # subject_name 
    task: split_groups
    partial:
      df: ${{ workflow.rename_event_cols.return }}
      groupers: ${{ workflow.groupers.return }}
    
  # Split the relocations by group
  - name: Split relocations by group
    id: split_relocs_by_group
    task: split_groups
    partial:
      df: ${{ workflow.map_reloc_cols.return }}
      groupers: ${{ workflow.groupers.return }}

  # Convert relocations to trajectories
  - name: Trajectory Segment Filter  
    id: custom_trajs_filter
    task: ecoscope_workflows_ext_ste.tasks.transformation.trajectory_segment_filter

  - name: Convert relocations to trajectories
    id: convert_to_trajectories
    task: relocations_to_trajectory
    partial:
      relocations: ${{ workflow.map_reloc_cols.return }}
      trajectory_segment_filter: ${{ workflow.custom_trajs_filter.return }}
  
  # Add temporal index to subject trajectories using segment_start
  - name: Add temporal index to trajectories
    id: add_temporal_index_to_traj
    task: add_temporal_index
    partial:
      df: ${{ workflow.convert_to_trajectories.return }}
      time_col: segment_start
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed 

  # proceed to further generate a speedmap 
  - name: Classify trajectories by speed 
    id: classify_trajectories_speed_bins 
    task: apply_classification 
    partial: 
      df: ${{ workflow.add_temporal_index_to_traj.return }}
      input_column_name: speed_kmhr
      output_column_name: speed_bins
      classification_options: 
        scheme: equal_interval 
        k: 6 
      label_options:
        label_ranges: true
        label_decimals: 1
        label_suffix: ' km/h'
  
  - name: Rename trajectory columns
    id: rename_traj_cols
    task: map_columns
    partial:
      raise_if_not_found: false
      df: ${{ workflow.classify_trajectories_speed_bins.return }}
      drop_columns: []
      retain_columns: [] 
      rename_columns: 
        extra__hex_color: hex_color
        extra__subject_name: subject_name
        extra__subject_sex: subject_sex
        extra__subject_subtype: subject_subtype
        extra__created_at: created_at

  - name: Persist trajectories as parquet
    id: persist_trajectories
    task: persist_df
    partial:
      df: ${{ workflow.rename_traj_cols.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: trajectories
      filetype: parquet

  - name: Split trajectories by group
    id: split_traj_by_group
    task: split_groups
    partial:
      df: ${{ workflow.rename_traj_cols.return }}
      groupers: ${{ workflow.groupers.return }}

  #1. Speedmap
  - name: Sort trajectories by speed bins 
    id: sort_trajs_by_speed 
    task: sort_values
    partial: 
      column_name: speed_bins 
      na_position: first 
      ascending: true 
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.split_traj_by_group.return }}
  
  - name: Apply colormap to speed bins 
    id: apply_speed_colormap 
    task: apply_color_map 
    partial: 
      input_column_name: speed_bins
      output_column_name: speed_bins_colormap 
      colormap: 
        - '#1a9850'
        - '#91cf60'
        - '#d9ef8b'
        - '#fee08b'
        - '#fc8d59'
        - '#d73027'
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.sort_trajs_by_speed.return }}
    
  - name: Exclude unnecessary columns speedmap columns
    id: filter_speed_cols 
    task: subset_columns 
    partial: 
      columns: 
        - speed_bins
        - speed_bins_colormap
        - speed_kmhr
        - subject_name
        - geometry
      exclude: null
      strict: false
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.apply_speed_colormap.return }}


  - name: Generate speedmap layers 
    id: generate_speedmap_layers 
    task: ecoscope_workflows_ext_custom.tasks.results.create_path_layer
    partial: 
      data_url: null
      layer_style:
        get_color: speed_bins_colormap
        get_width: 2.25
        width_scale: 1 
        width_min_pixels: 2 
        width_max_pixels: 8 
        width_units: pixels
        cap_rounded: true 
        joint_rounded: true
        billboard: false
        opacity: 0.45
        stroked: true 
      legend:
        title: Speed (km/h)
        label_column: speed_bins
        color_column: speed_bins_colormap
        sort: ascending 
        label_suffix: null
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.filter_speed_cols.return }} 
  
  - name: Zoom to speedmap values
    id: zoom_to_subject
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.envelope_gdf
    partial:
      expansion_factor: 1.25
    mapvalues: 
      argnames: gdf 
      argvalues: ${{ workflow.filter_speed_cols.return }}

  - name: Zoom view to  speed gdf extent
    id: subject_extent
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.compute_view_state_from_gdf
    partial:
      pitch: 0
      bearing: 0
      max_zoom: 15
    mapvalues:
      argnames: gdf
      argvalues: ${{ workflow.zoom_to_subject.return }}
    
  - name: Combine speed layers and ldx layers
    id: combined_ldx_speed_layers
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.combine_deckgl_map_layers
    partial:
      static_layers: 
        - ${{ workflow.create_community_layer.return }}
        - ${{ workflow.create_reserve_layer.return }}
        - ${{ workflow.create_park_layer.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.generate_speedmap_layers.return }}

  - name: Combine speedmap layers with view state 
    id: zip_speedmap_with_viewstate
