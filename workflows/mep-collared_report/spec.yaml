# 2. Home Range 
  - name: Generate etd 
    id: generate_etd 
    task: calculate_elliptical_time_density
    partial: 
      auto_scale_or_custom_cell_size:
        auto_scale_or_custom: Auto-scale 
      crs: ESRI:53042
      percentiles: 
        - 50.0 
        - 60.0 
        - 70.0
        - 80.0
        - 90.0
        - 95.0
        - 99.9
      nodata_value: nan 
      band_count: 1
      max_speed_factor: 1.05 
      expansion_factor: 1.3
    mapvalues:
      argnames: trajectory_gdf 
      argvalues: ${{ workflow.split_traj_by_group.return }}

  - name: Determine seasonal windows 
    id: determine_seasonal_windows 
    task: ecoscope_workflows_ext_ste.tasks.io.compute_seasons_from_ndvi
    partial: 
      client: ${{ workflow.gee_project_name.return }}
      time_range: ${{ workflow.time_range.return }}
      img_collection: "MODIS/061/MCD43A4"
      nir_band: "Nadir_Reflectance_Band2"
      red_band: "Nadir_Reflectance_Band1"
      chunk_count: 5
    mapvalues: 
      argnames: roi 
      argvalues: ${{ workflow.generate_etd.return }}
  
  - name: Build seasonal windows filename
    id: seasonal_win_filename
    task: prefix_string_var
    partial:
      var: _seasonal_windows
    mapvalues:
      argnames: prefix
      argvalues: ${{ workflow.safe_subject_name.return }}

  - name: Zip seasonal windows filename with df
    id: zip_seasonal_win_filename
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.seasonal_win_filename.return }}
        - ${{ workflow.determine_seasonal_windows.return }}

  - name: Persist subject seasonal windows
    id: persist_subject_seasonal_windows
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
    mapvalues:
      argnames:
        - filename
        - df
      argvalues: ${{ workflow.zip_seasonal_win_filename.return }}

  - name: Zip seasons with trajectories 
    id: zip_etd_with_traj 
    skipif:
      conditions:
        - any_dependency_skipped
        - any_keyed_iterables_are_skips
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.determine_seasonal_windows.return }}
        - ${{ workflow.split_traj_by_group.return }}
  
  - name: Generate season labels 
    id: add_season_labels 
    task: create_seasonal_labels 
    mapvalues: 
      argnames: 
        - seasons_df 
        - trajectories 
      argvalues: ${{ workflow.zip_etd_with_traj.return }}
  
  - name: Generate MCP gdf from trajectories 
    id: generate_mcp 
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.compute_minimum_convex_polygon
    partial: 
      planar_crs: ESRI:53042
    mapvalues: 
      argnames: gdf 
      argvalues: ${{ workflow.split_traj_by_group.return }}
  
  - name: Apply colormap to home range percentiles 
    id: apply_etd_colormap 
    task: apply_color_map
    partial: 
      input_column_name: percentile
      output_column_name: etd_percentile_colors
      colormap: RdYlGn
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.generate_etd.return }}

  - name: Create home range layers 
    id: generate_home_range_layers 
    task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
    partial: 
      data_url: null
      layer_style: 
        filled: true 
        stroked: true 
        extruded: false 
        wireframe: false
        get_fill_color: etd_percentile_colors
        get_line_color: etd_percentile_colors
        opacity: 0.45 
        get_line_width: 1.55
        get_elevation: 0
        get_point_radius: 1
        line_width_units: pixels 
        line_width_scale: 1 
        line_width_min_pixels: 1
        line_width_max_pixels: 5

      legend: 
        title: Home Range Percentiles
        label_column: percentile
        color_column: etd_percentile_colors
        sort: ascending 
        label_suffix: null
    mapvalues: 
