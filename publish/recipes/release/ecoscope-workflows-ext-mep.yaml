context:
  name: ecoscope-workflows-ext-mep
  version: ${{ env.get("HATCH_VCS_VERSION") }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ../../..  # get back to root of repo

build:
  noarch: python
  script: SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }} python -m pip install src/ecoscope-workflows-ext-mep -vv --no-deps
  number: 0

requirements:
  host:
    - python
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python
    - wt-registry >=0.2.0,<0.3.0
    - wt-task >=0.1.0,<0.2.0
    - ecoscope-platform >=2.15.0,<3.0.0
    - ecoscope
    - ecoscope-workflows-ext-custom
    - geopandas
    - shapely
    - docxtpl
    - playwright
    - imageio-ffmpeg
    - numpy
    - setuptools <=81.0.0
    - docxcompose
tests:
  # Non-Python files the package reads at import time. The wheel build (hatch, only-packages) silently
  # drops files outside a Python package, which shipped 1.11.1 without the widgets bundle and broke
  # `import ecoscope_workflows_ext_mep.tasks`; fail the build instead.
  - package_contents:
      site_packages:
        - ecoscope_workflows_ext_mep/tasks/animate/assets/__init__.py
      files:
        - site-packages/ecoscope_workflows_ext_mep/tasks/animate/assets/my-deck-widgets.js

about:
  license: BSD-3-Clause

extra:
  recipe-maintainers:
    - tevin-temu
