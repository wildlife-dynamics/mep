  - name: Download monthly cover page template
    id: download_cover_page
    task: fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/95fux8w00h9u4wg2sufij/mep_monthly_report.docx?rlkey=nbibg8ulnlz0w4q53jw2db6y3&st=6own6h01&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false

  - name: Download monthly content template
    id: download_content_page
    task: fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/1u7d68pr8hvc27gf2ns85/mep_monthly_indv_report.docx?rlkey=wss0x8sa9i5fgl9yjco7paa03&st=b8fsdnxg&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false

  - name: Download mep logo
    id: download_logo
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/se63iljd7h9zdi4szv2pt/MEP-logo-dark-linear.png?rlkey=usqs76f4ejd2nyqrpmwxmks0o&st=0z2jfaif&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      unzip: false
      retries: 2

  - name: Create cover page context 
    id: cover_page_context 
    task: prepare_cover_metadata 
    partial: 
      org_logo_path: ${{ workflow.download_logo.return }}
      report_period: ${{ workflow.time_range.return }}
      prepared_by: "Ecoscope"
      extra_fields: null
      time_generated_format: "%Y-%m-%d %H:%M:%S"

  - name: Persist cover page
    id: persist_cover_page
    skipif:
      conditions:
        - any_dependency_skipped
      unpack_depth: 1
    task: create_context_page
    partial:
      template_path: ${{ workflow.download_cover_page.return }}
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      context: ${{ workflow.cover_page_context.return }}
      filename: "mep_monthly_cover_page.docx"



