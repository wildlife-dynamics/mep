# Bundles Playwright's "chromium-headless-shell" browser so that
# `chromium.launch()` works without `playwright install` (cloud / offline).
#
# Installed layout:
#   $PREFIX/share/ms-playwright/chromium_headless_shell-<revision>/chrome-headless-shell-<cft_platform>/...
# and activation scripts export PLAYWRIGHT_BROWSERS_PATH=$PREFIX/share/ms-playwright
# (only when the variable is not already set). On Linux they also set
# FONTCONFIG_FILE=$PREFIX/etc/fonts/fonts.conf (if unset) so the bundled fontconfig
# finds fonts-conda-ecosystem fonts in containers without system fonts.
#
# The browser revision is decided by the Playwright *driver* (the node package:
# conda-forge `playwright`, or the bundled driver in the microsoft-channel `playwright`
# python package), not by `playwright-python`. To bump: run
#   playwright install --dry-run chromium-headless-shell
# with the target driver version and update version / revision / browser_version
# and the four sha256 values below.

context:
  name: playwright-chromium-headless-shell
  version: "1.62.0"
  # from playwright-core/browsers.json of driver 1.62.x
  revision: "1234"
  browser_version: "151.0.7922.34"
  cft_platform: ${{ "linux64" if linux else ("mac-arm64" if (osx and arm64) else ("mac-x64" if osx else "win64")) }}
  # same relative path on every platform (incl. Windows) so the runtime can use <prefix>/share/ms-playwright
  install_dir: share/ms-playwright

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - if: target_platform == "linux-64"
    then:
      url: https://cdn.playwright.dev/builds/cft/${{ browser_version }}/linux64/chrome-headless-shell-linux64.zip
      sha256: 3cfc2bd00d1bafcf8a68dc74c9c92bb7150ddc8d26ade948a776316e1cec4f14
      # keep the zip as-is; build.sh unzips it so the top-level dir name is preserved
      file_name: chrome-headless-shell.zip
  - if: osx and arm64
    then:
      url: https://cdn.playwright.dev/builds/cft/${{ browser_version }}/mac-arm64/chrome-headless-shell-mac-arm64.zip
      sha256: cb46a336dbe3d6f1339c5039c3083e4e5dd8e4379710790e34f8f4a865e2452d
      file_name: chrome-headless-shell.zip
  - if: osx and x86_64
    then:
      url: https://cdn.playwright.dev/builds/cft/${{ browser_version }}/mac-x64/chrome-headless-shell-mac-x64.zip
      sha256: 608e2b5b1815b45e8bf59c9a381412b62df3ce36f2c182bc04e22fcf04ad53ea
      file_name: chrome-headless-shell.zip
  - if: target_platform == "win-64"
    then:
      url: https://cdn.playwright.dev/builds/cft/${{ browser_version }}/win64/chrome-headless-shell-win64.zip
      sha256: 46cc69ef55ba29268ffe32dda4192a9d2165be42c3f4e923241153d519493aea
      file_name: chrome-headless-shell.zip

build:
  number: 0
  skip:
    - not (target_platform in ["linux-64", "osx-arm64", "osx-64", "win-64"])
  script:
    env:
      PW_REVISION: ${{ revision }}
      PW_CFT_PLATFORM: ${{ cft_platform }}
      PW_INSTALL_DIR: ${{ install_dir }}
    file: ${{ "bld.bat" if win else "build.sh" }}
  # Chrome binaries are prebuilt; nothing to fix up via prefix replacement.
  prefix_detection:
    ignore: true
  dynamic_linking:
    # macOS: never touch the Mach-O files (it would invalidate Google's code signature).
    # linux: rewrite RPATH of the ELF files so they resolve the conda-forge libs in $PREFIX/lib.
    binary_relocation: ${{ true if linux else false }}
    rpaths:
      - lib/
    # glibc comes from the system (__glibc); Chrome's own libEGL / libGLESv2 /
    # libvk_swiftshader / libvulkan are dlopen'ed from its directory.
    missing_dso_allowlist:
      - "**/libc.so.6"
      - "**/libm.so.6"
      - "**/libdl.so.2"
      - "**/libpthread.so.0"
      - "**/librt.so.1"
      - "**/ld-linux-x86-64.so.2"

requirements:
  build:
    - if: unix
      then:
        - unzip
    # rattler-build uses patchelf to rewrite the ELF RPATHs (also when cross-building from macOS)
    - if: linux
      then:
        - patchelf
  # linux: one conda-forge package per DT_NEEDED entry of chrome-headless-shell
  # (`readelf -d`), so rattler-build's linkage check verifies each one resolves in
  # $PREFIX/lib; their run_exports become the run pins.
  host:
    - if: linux
      then:
        - libgcc          # libgcc_s.so.1
        - libglib         # libglib-2.0, libgobject-2.0, libgio-2.0
        - nspr            # libnspr4
        - nss             # libnss3, libnssutil3
        - atk-1.0         # libatk-1.0
        - at-spi2-atk     # libatk-bridge-2.0
        - at-spi2-core    # libatspi
        - dbus            # libdbus-1
        - xorg-libx11
        - xorg-libxcomposite
        - xorg-libxdamage
        - xorg-libxext
        - xorg-libxfixes
        - xorg-libxrandr
        - libxcb
        - libxkbcommon
        - libgbm          # libgbm.so.1 (mesa)
        - libexpat
        - libudev1        # libudev.so.1
        - alsa-lib        # libasound.so.2
  run:
    - if: osx
      then:
        - __osx >=12.0    # Chrome >=139 requires macOS 12+
    - if: linux
      then:
        - __glibc >=2.25  # highest GLIBC_ symbol version chrome-headless-shell needs
        - libgcc
        - libglib
        - nspr
        - nss
        - atk-1.0
        - at-spi2-atk
        - at-spi2-core
        - dbus
        - xorg-libx11
        - xorg-libxcomposite
        - xorg-libxdamage
        - xorg-libxext
        - xorg-libxfixes
        - xorg-libxrandr
        - libxcb
        - libxkbcommon
        - libgbm
        - libexpat
        - libudev1
        - alsa-lib
        # fonts so text renders in a bare container (no system fonts)
        - fontconfig
        - fonts-conda-ecosystem
  run_constraints:
    # browser revision ${{ revision }} is the one pinned by Playwright driver ${{ version }}
    - playwright >=1.62.0,<1.63.0a0
  ignore_run_exports:
    by_name:
      - unzip
      - patchelf

tests:
  - script:
      - if: unix
        then:
          - test -x "$PREFIX/${{ install_dir }}/chromium_headless_shell-${{ revision }}/chrome-headless-shell-${{ cft_platform }}/chrome-headless-shell"
          - test "$PLAYWRIGHT_BROWSERS_PATH" = "$PREFIX/${{ install_dir }}"
          - if: linux
            then:
              - test "$FONTCONFIG_FILE" = "$PREFIX/etc/fonts/fonts.conf"
        else:
          - if not exist "%PREFIX%\share\ms-playwright\chromium_headless_shell-${{ revision }}\chrome-headless-shell-${{ cft_platform }}\chrome-headless-shell.exe" exit 1
          - if not "%PLAYWRIGHT_BROWSERS_PATH%"=="%PREFIX%\share\ms-playwright" exit 1

about:
  homepage: https://playwright.dev/docs/browsers
  summary: Playwright's chromium-headless-shell (Chrome for Testing ${{ browser_version }}, Playwright revision ${{ revision }}) preinstalled for PLAYWRIGHT_BROWSERS_PATH
  license: BSD-3-Clause
  license_file: chrome-headless-shell-${{ cft_platform }}/LICENSE.headless_shell
  description: |
    Ships the exact chromium-headless-shell build that Playwright ${{ version }} downloads
    with `playwright install chromium-headless-shell`, installed into
    $PREFIX/share/ms-playwright (also on Windows).
    Activating the environment sets PLAYWRIGHT_BROWSERS_PATH to that directory
    unless it is already set.

extra:
  recipe-maintainers:
    - tevin-temu
